  <body>
    <div id="root"></div>
    <script>
      /* boot guard. shows the deployment screen ONLY when all of these hold:
         1) not a dev server (vite dev/preview always run on a port — dev keeps its own error overlay)
         2) #root is still empty (the app never managed to mount anything)
         3) the failure is ours (the main.tsx entry or a /assets/ bundle — never extension scripts) */
      (function () {
        var isDevServer = location.port !== "";
        var shown = false;
        function rootEmpty() {
          var r = document.getElementById("root");
          return !r || r.childElementCount === 0;
        }
        window.__ppcBootFail = function (reason) {
          if (shown || !rootEmpty()) return;
          shown = true;
          var r = document.getElementById("root");
          if (!r) return;
          r.innerHTML =
            '<div style="min-height:100vh;background:#000080;color:#fff;font-family:VT323,Courier New,monospace;display:flex;align-items:center;justify-content:center;padding:24px">' +
            '<div style="max-width:640px;width:100%;background:silver;color:#000;border:2px solid;border-color:#fff #4a4a4a #4a4a4a #fff;padding:3px">' +
            '<div style="background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-family:Tahoma,Verdana,sans-serif;font-size:13px;font-weight:bold;padding:3px 6px">PIPISCLUB.EXE — Application Error</div>' +
            '<div style="padding:16px;font-family:VT323,Courier New,monospace">' +
            '<div style="font-size:26px;line-height:1.1;font-weight:bold">FATAL: you are browsing the RAW SOURCE of the club.</div>' +
            '<div style="font-size:20px;margin-top:10px">GitHub Pages cannot run <b>/src/main.tsx</b> — it is served as<br><b>application/octet-stream</b> and your browser (correctly) refused it. ' +
            (reason ? "<br>(" + reason + ")" : "") + "</div>" +
            '<div style="font-size:20px;margin-top:14px;border:2px dashed #800000;padding:10px;background:#fff">' +
            "IT FIXES ITSELF — no settings, no manual build:<br>" +
            "1) this repo ships <b>.github/workflows/publish.yml</b><br>" +
            "2) every push builds the club and commits the built site to the <b>root of this branch</b><br>" +
            "3) wait ~1 minute for the workflow, then <b>hard reload</b> (Ctrl+F5)<br>" +
            "4) if it never runs: check the <b>Actions</b> tab (is Actions enabled for the repo?)</div>" +
            '<div style="margin-top:14px;text-align:center"><button onclick="location.reload()" style="font-family:inherit;font-size:20px;padding:4px 22px;cursor:pointer">↻ RELOAD</button></div>' +
            "</div></div></div>";
        };
        if (isDevServer) return; // dev: vite's own overlay is in charge, stay out of the way
        window.addEventListener("error", function (e) {
          if (!rootEmpty()) return; // app is alive — never hijack
          if (e && e.target && e.target.tagName === "SCRIPT") {
            var src = e.target.getAttribute("src") || "";
            if (/main\.tsx|(\/|^)assets\//.test(src)) window.__ppcBootFail("script load failed: " + src);
          } else if (!e.target || e.target === window) {
            window.__ppcBootFail("runtime error: " + (e.message || "unknown"));
          }
        }, true);
        /* raw-source pages still carry the /src/main.tsx tag; a built dist does not */
        document.addEventListener("DOMContentLoaded", function () {
          if (document.querySelector('script[src*="main.tsx"]')) {
            setTimeout(function () {
              if (!window.__PPC_MOUNTED && rootEmpty()) window.__ppcBootFail("the app never mounted");
            }, 8000);
          }
        });
      })();
    </script>
  </body>
